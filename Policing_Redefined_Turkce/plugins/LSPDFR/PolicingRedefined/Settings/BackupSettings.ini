[Keybind]
//Key to open the backup menu.
KeybindOpenDispatchMenu=O
//Key modifier to open the backup menu.
KeybindOpenDispatchMenuModifier=None
//Key to open the unit manager menu.
KeybindOpenManagerMenu=B
//Key modifier to open the unit manager menu.
KeybindOpenManagerMenuModifier=LControlKey
//Key to hold to teleport all dispatched units to their destination.
KeybindFastDispatch=Back
//Key modifier to hold to teleport all dispatched units to their destination.
KeybindFastDispatchModifier=None
//Key to hold to quickly dismiss all active units (except prisoner transports and tow trucks with a vehicle assigned).
KeybindDismissAllUnits=Enter
//Key modifier to hold to quickly dismiss all active units (except prisoner transports and tow trucks with a vehicle assigned).
KeybindDismissAllUnitsModifier=None
//Key to open the door for the K9 remotely or make it attack a certain ped.
KeybindK9QuickAction=X
//Key modifier to open the door for the K9 remotely or make it attack a certain ped.
KeybindK9QuickActionModifier=None
//Key to make (non-K9) partners enter or exit a vehicle.
KeybindPartnerEnterExitVehicle=C
//Key modifier to make (non-K9) partners enter or exit a vehicle.
KeybindPartnerEnterExitVehicleModifier=None
//Key to quick access the felony stop menu (only in manual mode).
KeybindOpenFelonyStopMenu=U
//Key modifier to quick access the felony stop menu (only in manual mode).
KeybindOpenFelonyStopMenuModifier=None
//Key to request panic backup (look below for configuration).
KeybindPanicButton=RControlKey
//Key modifier to request panic backup.
KeybindPanicButtonModifier=NumPad0
//Key to request group backup (look below for configuration).
KeybindGroupBackup=O
//Key modifier to request group backup.
KeybindGroupBackupModifier=RControlKey

[Controller]
//Button to open the backup menu.
ControllerOpenDispatchMenu=RightThumb
//Button modifier to open the backup menu.
ControllerOpenDispatchMenuModifier=None
//Button to open the unit manager menu.
ControllerOpenManagerMenu=RightThumb
//Button modifier to open the unit manager menu.
ControllerOpenManagerMenuModifier=DPadLeft
//Button to hold to teleport all dispatched units to their destination.
ControllerFastDispatch=LeftThumb
//Button modifier to hold to teleport all dispatched units to their destination.
ControllerFastDispatchModifier=None
//Button to hold to quickly dismiss all active units (except prisoner transports and tow trucks with a vehicle assigned).
ControllerDismissAllUnits=None
//Button modifier to hold to quickly dismiss all active units (except prisoner transports and tow trucks with a vehicle assigned).
ControllerDismissAllUnitsModifier=None
//Button to open the door for the K9 remotely or make it attack a certain ped.
ControllerK9QuickAction=None
//Button modifier to open the door for the K9 remotely or make it attack a certain ped.
ControllerK9QuickActionModifier=None
//Button to make (non-K9) partners enter or exit a vehicle.
ControllerPartnerEnterExitVehicle=None
//Button modifier to make (non-K9) partners enter or exit a vehicle.
ControllerPartnerEnterExitVehicleModifier=None
//Button to quick access the felony stop menu (only in manual mode).
ControllerOpenFelonyStopMenu=DPadDown
//Button modifier to quick access the felony stop menu (only in manual mode).
ControllerOpenFelonyStopMenuModifier=None
//Button to request panic backup (look below for configuration).
ControllerPanicButton=None
//Button modifier to request panic backup.
ControllerPanicButtonModifier=None
//Button to request group backup (look below for configuration).
ControllerGroupBackup=None
//Button modifier to request group backup.
ControllerGroupBackupModifier=None

[K9]
//Sets whether the K9 should sit down or bark when it detected something on a ped or a vehicle. (Sit, Bark)
K9IndicationType=Sit

[Coroner]
//Time after a coroner unit left the scene to receive autopsy reports. (milliseconds)
CoronerAutopsyReportTime=40000

[PanicBackup]
//The units from your .xml configs (names MUST match!) that should be dispatched upon requesting panic backup. (separated by comma)
PanicBackupUnits=LocalPatrol,LocalPatrol,LocalPatrol,StatePatrol,StatePatrol

[GroupBackup]
//The units from your .xml configs (names MUST match!) that should be dispatched upon requesting group backup. (separated by comma)
GroupBackupUnits=Ambulance,LocalPatrol
//The response code of the group backup. (Code1, Code2, Code3)
GroupBackupResponse=Code3

[FelonyStop]
//Amount of units to dispatch when starting a felony stop in auto mode and no units are on scene. (0 = disabled, 2 = recommended, if at all)
FelonyStopAutoDispatchUnits=0

[ExternalDispatch]
//The response code a tow truck should use when requested outside the dispatch menu. (Code1, Code2, Code3)
ExternalDispatchTowTruck=Code1
//The response code a prisoner transport should use. (Code1, Code2, Code3)
ExternalDispatchPrisonerTransport=Code1

