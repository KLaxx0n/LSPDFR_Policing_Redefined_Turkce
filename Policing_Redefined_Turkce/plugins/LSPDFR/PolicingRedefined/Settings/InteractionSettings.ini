[Keybind]
//Key for stopping peds, vehicles, and more.
KeybindOpenMenu=T
//Key modifier for stopping peds, vehicles, and more.
KeybindOpenMenuModifier=None
//Key for opening the miscellaneous menu.
KeybindOpenMiscMenu=T
//Key modifier for opening the miscellaneous menu.
KeybindMiscMenuModifier=LControlKey
//Key for activating speed boost.
KeybindSpeedBoost=Enter
//Key modifier for activating speed boost.
KeybindSpeedBoostModifier=None
//Key for tackling a nearby ped while running.
KeybindTackle=Back
//Key modifier for tackling a nearby ped while running.
KeybindTackleModifier=None
//Key for grabbing any nearby ped.
KeybindGrab=D7
//Key modifier for grabbing any nearby ped.
KeybindGrabModifier=None
//Key for starting a pursuit on the aimed at ped.
KeybindStartPursuit=T
//Key modifier for starting a pursuit on the aimed at ped.
KeybindStartPursuitModifier=None
//Key for searching any nearby ped or vehicle.
KeybindSearch=F10
//Key modifier for searching any nearby ped or vehicle.
KeybindSearchModifier=LShiftKey
//Key for quickly grabbing spikes from a nearby patrol vehicle.
KeybindQuickSpikes=G
//Key modifier for quickly grabbing spikes from a nearby patrol vehicle.
KeybindQuickSpikesModifier=LShiftKey

[Controller]
//Button for stopping peds, vehicles, and more.
ControllerOpenMenu=DPadRight
//Button modifier for stopping peds, vehicles, and more.
ControllerOpenMenuModifier=None
//Button for opening the miscellaneous menu.
ControllerOpenMiscMenu=A
//Button modifier for opening the miscellaneous menu.
ControllerMiscMenuModifier=DPadLeft
//Button for activating speed boost.
ControllerSpeedBoost=A
//Button modifier for activating speed boost.
ControllerSpeedBoostModifier=None
//Button for tackling a nearby ped while running.
ControllerTackle=B
//Button modifier for tackling a nearby ped while running.
ControllerTackleModifier=None
//Button for grabbing any nearby ped.
ControllerGrab=B
//Button modifier for grabbing any nearby ped.
ControllerGrabModifier=DPadLeft
//Button for starting a pursuit on the aimed at ped.
ControllerStartPursuit=None
//Button modifier for starting a pursuit on the aimed at ped.
ControllerStartPursuitModifier=None
//Button for searching any nearby ped or vehicle.
ControllerSearch=None
//Button modifier for searching any nearby ped or vehicle.
ControllerSearchModifier=None
//Button for quickly grabbing spikes from a nearby patrol vehicle.
ControllerQuickSpikes=None
//Button modifier for quickly grabbing spikes from a nearby patrol vehicle.
ControllerQuickSpikesModifier=None

[Weapons]
//Whether only one long-gun is allowed to be taken from a patrol vehicle at a time. (True/False)
LimitToOneLongGun=True

[Vehicle]
//The probability for a driver to not have their vehicle registration documents on them. (0-100)
VehicleRegNotWithDriverChance=30
//The probability for a driver to not have their vehicle insurance documents on them. (0-100)
VehicleInsNotWithDriverChance=30
//The minimum VLT value for pure black window tint, if you don't know what this is, best to leave it at default.
PureBlackTintMinVLT=2
//The maximum VLT value for pure black window tint, if you don't know what this is, best to leave it at default.
PureBlackTintMaxVLT=24
//The minimum VLT value for darksmoke window tint, if you don't know what this is, best to leave it at default.
DarkSmokeTintMinVLT=25
//The maximum VLT value for darksmoke window tint, if you don't know what this is, best to leave it at default.
DarkSmokeTintMaxVLT=59
//The minimum VLT value for lightsmoke window tint, if you don't know what this is, best to leave it at default.
LightSmokeTintMinVLT=60
//The maximum VLT value for lightsmoke window tint, if you don't know what this is, best to leave it at default.
LightSmokeTintMaxVLT=79
//The minimum VLT value for limo window tint, if you don't know what this is, best to leave it at default.
LimoTintMinVLT=80
//The maximum VLT value for limo window tint, if you don't know what this is, best to leave it at default.
LimoTintMaxVLT=95

[TrafficControl]
//The radius of a traffic control zone.
TrafficControlRadius=60
//The maximum distance to you before a traffic control zone is automatically lifted.
TrafficControlMaxDistance=45
//The speed of vehicles within a slowed traffic control zone.
TrafficControlSlowSpeed=5

[PedResistance]
//The general probability for a ped to perform any of the resistance actions below. (0-100)
PedResistanceChance=8
//The probability for a ped to attack you. (0-100)
PedResistanceAttackChance=12
//The probability for a ped to flee from you. (0-100)
PedResistanceFleeChance=17
//The probability for a ped to act like a Karen. (0-100)
PedResistanceUncooperativeChance=22
//The probability for a ped to surrender after being tazed. (0-100)
PedSurrenderChance=18
//Minimum time a ped should wait before starting a resistance action. (seconds)
PedResistanceMinIgnoreTime=3
//Maximum time a ped should wait before starting a resistance action. (seconds)
PedResistanceMaxIgnoreTime=8

[SearchItem]
//Whether to display search results in a full screen view. (True/False)
SearchItemsResultsFullScreen=False
//Whether to pause the game when displaying search results in a full screen view. (True/False)
SearchItemsResultsFullScreenPauseGame=True
//Whether to blur the game when displaying search results in a full screen view. (True/False)
SearchItemsResultsFullScreenBlur=True
//Probability for a green search item. (color chances MUST add up to 100!)
SearchItemGreenChance=65
//Probability for a yellow search item. (color chances MUST add up to 100!)
SearchItemYellowChance=25
//Probability for a red search item (color chances MUST add up to 100!).
SearchItemRedChance=10
//Minimum amount of items per ped.
MinPedSearchItems=1
//Maximum amount of items per ped.
MaxPedSearchItems=6
//Minimum amount of items per vehicle.
MinVehSearchItems=3
//Maximum amount of items per vehicle.
MaxVehSearchItems=12
//Probability for a seized weapon to have a scratched serial number. (0-100)
SearchItemWeaponScratchedSN=12
//Probability for a seized weapon to be stolen. (0-100)
SearchItemWeaponStolen=15
//Probability for a seized weapon to be unregistered. (0-100)
SearchItemWeaponUnregistered=10

[Cheats]
//Multiplier for speed boost. (0-100)
SpeedBoostMultiplier=50
//Time of how long the speed boost should last once activated. (seconds)
SpeedBoostDuration=3
//Multiplier on how easy or difficult the enhanced PIT maneuver should be. (NOT 0-100, instead a factor)
PitDifficultyMultiplier=1

[Ambient]
//Maximum amount of drunk peds that can exist at a time.
AmbientMaxDrunkPeds=4
//Maximum amount of peds on drugs that can exist at a time.
AmbientMaxHighPeds=4
//Minimum time before a new ped is set as an ambient event. (seconds)
MinTimeBetweenNewPed=20
//Maximum time before a new ped is set as an ambient event. (seconds)
MaxTimeBetweenNewPed=45
//Maximum amount of vehicles with vehicle tint
MaxVehiclesWithTint=20
//Minimum time before a new vehicle is given tint
MinTimeBetweenNewVehicleTint=20
//Maximum time before a new vehicle is given tint
MaxTimeBetweenNewVehicleTint=45
//Chance of the window tint being limo tint, all chances of tint types combined should equal 100
LimoTintChance=30
//Chance of the window tint being Light Smoke tint, all chances of tint types combined should equal 100
LightSmokeTintChance=30
//Chance of the window tint being Dark Smoke tint, all chances of tint types combined should equal 100
DarkSmokeTintChance=25
//Chance of the window tint being Pure Black tint, all chances of tint types combined should equal 100
PureBlackTintChance=15
//Chance of peds to return to what they were doing before they were stopped; under certain conditions. (0-100)
DismissedPedContinueActionChance=45

[Menus]
//Whether to show a marker above the stopped ped you are currently talking to. (True/False)
EnableStoppedPedMarkers=True
//Whether to show a marker above the selected occupant on a traffic stop. (True/False)
EnableTrafficStopPedMarkers=True
//Whether to automatically reopen menus after an item was selected and the action performed. (True/False)
AutoReopenMenus=True
//Whether mouse control is enabled in menus. (True/False)
AllowMenuMouseControl=False

[Observation]
//The general probability for you to miss any observation. (0-100)
ObservationMissedChance=5
//The probability for you to not notice a weapon in a vehicle. (0-100)
ObservationWeaponChance=25

[IntoxicationTests]
//Whether to automatically switch into first-person when conducting a horizontal gaze test. (True/False)
AutoFPVHorizontalGaze=False
//The probability for a drug test to return incorrect results. (0-100)
FailedDrugTestChance=5
//The probability for a alcohol test to fail to return a result. (0-100)
FailedAlcoholTestChance=5

[Animation]
//Sets whether cuffs should be grabbed from the front or from the back. (Back, Front)
AnimationGrabCuffs=Back

[KeepCalm]
//Makes peds not go insane when e.g. gun shots are fired. (True/False)
KeepCalmEnabled=False
//The radius around you in which peds should be kept calm.
KeepCalmRadius=250

[Ped]
//Treats ID's and driver's licenses separately like in the EU and other non-US countries. (True/False)
PedSeparateIdentification=False
//Chance that a peds mood when you interact will be sad. This affects answers to questions. all chances of moods combined should equal 100
SadMoodChance=5
//Chance that a peds mood when you interact will be nervous. This affects answers to questions. all chances of moods combined should equal 100
NervousMoodChance=20
//Chance that a peds mood when you interact will be mad. This affects answers to questions. all chances of moods combined should equal 100
MadMoodChance=20
//Chance that a peds mood when you interact will be neutral. This affects answers to questions. all chances of moods combined should equal 100
NeutralMoodChance=50
//Chance that a peds mood when you interact will be sovereign. This affects answers to questions. all chances of moods combined should equal 100
SovereignMoodChance=5

[Persist]
//Persists nearby dead peds to prevent the game from deleting them easily. (True/False)
PersistDeadPedsEnabled=True
//Persists nearby empty vehicles to prevent the game from deleting them easily. (True/False)
PersistEmptyVehiclesEnabled=True

[Dispatch]
//Whether dispatch should repeat the license plate back to you during a vehicle check. (True/False)
DispatchRepeatLicensePlate=True

[Compatibility]
//Whether to enable the compatibility check for StopThePed/UltimateBackup. If you disable this and utilize PR with STP or UB, support will not be provided as unintended behavior may occur. (True/False)
EnableStpCompatibilityCheck=False

